# 버전 태그(v1.0.6 같은)를 올리면 깃허브 서버가 공개된 코드로 직접 exe와 설치 파일을 만들어
# Releases에 올린다. 누가 어떤 코드로 만들었는지 이 기록(Actions 탭)에 그대로 남는다.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # 릴리스 만들기

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 남이 만든 도구는 버전 이름 대신 고유 번호로 고정한다 (도구가 몰래 바뀌어도 그대로 쓰지 않게)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          # 10.0.404는 고정 설치기용 (bootstrap/global.json). 같은 SDK로 만들어야 늘 같은 파일이 나온다
          dotnet-version: |
            10.0.x
            10.0.404

      # 태그와 csproj 버전이 다르면 멈춘다 (실수로 다른 버전을 올리지 않게)
      - name: 버전 확인
        shell: pwsh
        # 태그 이름은 명령 안에 바로 넣지 않고 값으로 넘긴다 (이름에 명령이 섞여 있어도 실행되지 않게)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG.TrimStart("v")
          # v1.1.8-partyboss처럼 뒤에 이름이 붙으면 시험판: 앞 숫자만 csproj와 맞춰 본다
          $base = $tag.Split("-")[0]
          $ver = ([xml](Get-Content MapleBar.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($base -ne $ver) { throw "태그($tag)와 MapleBar.csproj 버전($ver)이 달라요" }
          "VER=$ver" >> $env:GITHUB_ENV
          "PRE=$(if ($tag -ne $base) { '1' } else { '' })" >> $env:GITHUB_ENV

      - name: exe 만들기
        run: dotnet publish MapleBar.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: 설치 파일 만들기
        shell: pwsh
        run: |
          # 서버에 깔린 버전에 기대지 않고 늘 같은 버전을 깐다
          choco install innosetup --version 6.7.1 -y --no-progress --force; if ($LASTEXITCODE) { exit 1 }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVer=$env:VER" installer\MapleBar.iss
          if ($LASTEXITCODE) { exit 1 }

      # 받은 파일이 이 빌드에서 나온 것과 같은지 누구나 확인할 수 있게 SHA256 값을 함께 올린다
      - name: 해시 만들기
        shell: pwsh
        run: |
          $f = "dist\MapleBar-Setup-$env:VER.exe"
          $h = (Get-FileHash $f -Algorithm SHA256).Hash
          "$h  MapleBar-Setup-$env:VER.exe" | Out-File -Encoding ascii dist\SHA256.txt
          "HASH=$h" >> $env:GITHUB_ENV

      # 패치 노트 페이지에서 받는 버전 없는 설치기. 켜면 최신 설치 파일을 받아 확인하고 설치한다.
      # 코드가 같으면 늘 같은 파일이 나와서 브라우저 보안 경고가 점점 사라진다.
      # (SHA256.txt에는 넣지 않는다. 바 안의 자동 업데이트가 그 파일을 그대로 읽는다)
      - name: 고정 설치기 만들기
        shell: pwsh
        working-directory: bootstrap
        run: |
          dotnet build MapleBar-Setup.csproj -c Release -o out
          if ($LASTEXITCODE) { exit 1 }
          Copy-Item out\MapleBar-Setup.exe ..\dist\MapleBar-Setup.exe
          "FIXED_HASH=$((Get-FileHash ..\dist\MapleBar-Setup.exe -Algorithm SHA256).Hash)" >> $env:GITHUB_ENV

      - name: 릴리스 올리기
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $notes = @"
          이 설치 파일은 깃허브 서버가 이 저장소의 공개된 코드로 직접 만들었어요.
          만든 기록: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          SHA256: ``$env:HASH``

          MapleBar-Setup.exe는 켜면 최신 버전을 받아 설치하는 작은 설치기예요. 버전이 바뀌어도 같은 파일이에요.
          SHA256: ``$env:FIXED_HASH``
          "@
          # 같은 버전을 다시 올리면(핫픽스) 예전 릴리스를 지우고 새로 만든다
          gh release view $env:TAG *> $null; if ($LASTEXITCODE -eq 0) { gh release delete $env:TAG --yes }
          if ($env:PRE) {
            # 시험판: 자동 업데이트와 받기용 설치기는 releases/latest만 보므로 시험판은 건드리지 않는다.
            # 고정 설치기는 최신 정식판을 받으니 올리지 않는다.
            gh release create $env:TAG "dist\MapleBar-Setup-$env:VER.exe" dist\SHA256.txt --prerelease --title "메이플 바 $env:TAG (시험판)" --notes $notes
          } else {
            gh release create $env:TAG "dist\MapleBar-Setup-$env:VER.exe" dist\SHA256.txt dist\MapleBar-Setup.exe --title "메이플 바 $env:VER" --notes $notes
          }
